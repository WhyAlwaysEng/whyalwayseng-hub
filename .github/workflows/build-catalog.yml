name: Build Catalog & Deploy

on:
  schedule:
    - cron: "0 */3 * * *"      # Every 3 hours
  push:
    branches: [main]
    paths: ["projects.json", "src/**", "scripts/**", "locales/**"]
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate projects.json
        run: node scripts/validate.mjs

      - name: Restore previous catalog (for fallback)
        run: |
          mkdir -p data
          curl -fsSL "${{ vars.SITE_URL }}/data/catalog.json" -o data/catalog.prev.json || echo '{"apps":[]}' > data/catalog.prev.json

      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/build-catalog.mjs

      - name: Build static pages, sitemap, and feed
        run: node scripts/build-site.mjs

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
