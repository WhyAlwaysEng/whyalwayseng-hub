name: Check Links & Repositories

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check all repositories exist and are public
        run: node scripts/validate.mjs --check-repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
