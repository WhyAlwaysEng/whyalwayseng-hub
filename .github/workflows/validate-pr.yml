name: Validate Pull Request

on:
  pull_request:
    paths: ["projects.json", "schema/**", "assets/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema and repositories
        run: node scripts/validate.mjs --check-repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
